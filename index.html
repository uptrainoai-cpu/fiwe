<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AdHabits Leads Marketplace</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#14171F;
    --surface:#1C212D;
    --surface-raised:#242B3A;
    --paper:#EDEFF4;
    --gold:#E8A93C;
    --gold-dim:#8A6A2C;
    --teal:#4FB0A5;
    --muted:#8B93A7;
    --border:#2E3444;
    --danger:#D9695F;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  .mono{font-family:'JetBrains Mono', monospace;}
  .display{font-family:'Fraunces', serif;}

  /* ===== LAYOUT ===== */
  .app{display:flex; min-height:100vh;}
  .sidebar{
    width:248px; flex-shrink:0;
    background:var(--surface);
    border-right:1px solid var(--border);
    display:flex; flex-direction:column;
    padding:24px 0;
    position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{
    padding:0 24px 24px 24px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  .brand-mark{
    display:flex; align-items:center; gap:10px;
  }
  .brand-stamp{
    width:34px; height:34px; border-radius:50%;
    border:1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    color:var(--gold); font-family:'Fraunces', serif; font-weight:700; font-size:15px;
    transform:rotate(-6deg);
    flex-shrink:0;
  }
  .brand-name{font-family:'Fraunces', serif; font-weight:600; font-size:17px; line-height:1.2;}
  .brand-sub{color:var(--muted); font-size:11px; letter-spacing:.06em; text-transform:uppercase; margin-top:2px;}

  .nav{list-style:none; padding:0 12px; display:flex; flex-direction:column; gap:2px;}
  .nav-item{
    display:flex; align-items:center; gap:12px;
    padding:10px 12px; border-radius:8px;
    color:var(--muted); font-size:14px; font-weight:500;
    cursor:pointer; transition:.15s; border:1px solid transparent;
    position:relative;
  }
  .nav-item:hover{background:var(--surface-raised); color:var(--paper);}
  .nav-item.active{background:var(--surface-raised); color:var(--gold); border-color:var(--border);}
  .nav-item.active::before{
    content:''; position:absolute; left:-12px; top:50%; transform:translateY(-50%);
    width:3px; height:18px; background:var(--gold); border-radius:2px;
  }
  .nav-icon{width:18px; height:18px; flex-shrink:0; display:flex; align-items:center; justify-content:center;}
  .nav-badge{
    margin-left:auto; background:var(--teal); color:var(--ink);
    font-size:10px; font-weight:700; padding:2px 6px; border-radius:20px;
    font-family:'JetBrains Mono', monospace;
  }

  .main{flex:1; min-width:0; padding:32px 40px 80px 40px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:32px;}
  .greeting{font-family:'Fraunces', serif; font-size:26px; font-weight:600;}
  .greeting-sub{color:var(--muted); font-size:13px; margin-top:4px;}
  .wallet{
    display:flex; align-items:center; gap:10px;
    background:var(--surface); border:1px solid var(--border);
    padding:10px 16px; border-radius:10px;
  }
  .wallet-label{font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em;}
  .wallet-value{font-family:'JetBrains Mono', monospace; font-weight:700; color:var(--gold); font-size:15px;}

  /* ===== DASHBOARD ===== */
  .stat-grid{display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:32px;}
  .stat-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:20px;
  }
  .stat-num{font-family:'JetBrains Mono', monospace; font-size:26px; font-weight:700; color:var(--paper);}
  .stat-label{color:var(--muted); font-size:12px; margin-top:6px; text-transform:uppercase; letter-spacing:.04em;}
  .section-title{font-family:'Fraunces', serif; font-size:19px; font-weight:600; margin-bottom:16px; display:flex; align-items:center; gap:10px;}
  .section-title .tag{
    font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--gold);
    border:1px solid var(--gold-dim); padding:2px 8px; border-radius:20px; font-weight:500;
  }
  .quick-grid{display:grid; grid-template-columns:repeat(2, 1fr); gap:16px; margin-bottom:32px;}
  .quick-card{
    background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:20px; cursor:pointer; transition:.15s; display:flex; justify-content:space-between; align-items:center;
  }
  .quick-card:hover{border-color:var(--gold-dim); transform:translateY(-1px);}
  .quick-card-title{font-weight:600; font-size:15px; margin-bottom:4px;}
  .quick-card-sub{color:var(--muted); font-size:12.5px;}
  .arrow{color:var(--gold); font-size:18px;}

  /* ===== LEADS BUY ===== */
  .platform-tabs{display:flex; gap:10px; margin-bottom:24px; border-bottom:1px solid var(--border); padding-bottom:0;}
  .platform-tab{
    padding:10px 20px; cursor:pointer; color:var(--muted); font-weight:600; font-size:14px;
    border-bottom:2px solid transparent; display:flex; align-items:center; gap:8px;
  }
  .platform-tab.active{color:var(--gold); border-bottom-color:var(--gold);}
  .platform-dot{width:8px; height:8px; border-radius:50%;}

  .card-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;}

  /* Rolodex-style index card = signature element */
  .lead-card{
    background:var(--paper); color:var(--ink); border-radius:4px 10px 10px 4px;
    position:relative; padding:20px 18px 18px 18px; cursor:pointer;
    transition:.18s ease; border:1px solid #C9CDD8;
    box-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  .lead-card:hover{transform:translateY(-3px); box-shadow:0 10px 20px rgba(0,0,0,.35);}
  .lead-card::before{
    /* punched tab of a rolodex card */
    content:''; position:absolute; left:-1px; top:14px; width:6px; height:34px;
    background:var(--gold); border-radius:0 3px 3px 0;
  }
  .lead-card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px;}
  .lead-card-title{font-family:'Fraunces', serif; font-weight:600; font-size:16.5px; line-height:1.25;}
  .lead-card-plat{font-size:10.5px; color:#6b7280; text-transform:uppercase; letter-spacing:.05em; margin-top:3px;}
  .stamp{
    width:46px; height:46px; border-radius:50%; border:1.5px dashed var(--gold-dim);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform:rotate(8deg); flex-shrink:0; color:#8A6A2C;
  }
  .stamp-price{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:13px;}
  .stamp-unit{font-size:7px; text-transform:uppercase;}
  .lead-card-desc{font-size:12.5px; color:#555c6b; margin-bottom:16px; line-height:1.5;}
  .lead-card-foot{display:flex; align-items:center; justify-content:space-between; border-top:1px dashed #C9CDD8; padding-top:12px;}
  .icon-btn{
    width:30px; height:30px; border-radius:50%; border:1px solid #C9CDD8; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.15s;
    font-size:14px; color:#8b93a7;
  }
  .icon-btn:hover{border-color:var(--gold-dim);}
  .icon-btn.on{background:var(--gold); border-color:var(--gold); color:#fff;}
  .icon-btn.on.bell{background:var(--teal); border-color:var(--teal);}
  .select-link{font-size:12.5px; font-weight:700; color:#1C212D; display:flex; align-items:center; gap:4px;}

  /* Region sub-picker chip row shown on region card */
  .region-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .region-chip{
    font-size:10.5px; padding:4px 9px; border-radius:20px; border:1px solid #C9CDD8; color:#555c6b;
    font-family:'JetBrains Mono', monospace;
  }

  /* ===== PACKAGE DETAIL / CHECKOUT PANEL ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(10,12,18,.65); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; z-index:50; padding:20px;
  }
  .hidden{display:none !important;}
  .panel{
    width:460px; max-width:100%; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:28px; max-height:88vh; overflow-y:auto;
  }
  .panel-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:6px;}
  .panel-title{font-family:'Fraunces', serif; font-size:20px; font-weight:600;}
  .close-x{cursor:pointer; color:var(--muted); font-size:20px; line-height:1;}
  .panel-plat{color:var(--muted); font-size:12px; margin-bottom:22px; text-transform:uppercase; letter-spacing:.04em;}

  .qty-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface-raised); border:1px solid var(--border); border-radius:10px; padding:14px 16px; margin-bottom:18px;}
  .qty-label{font-size:12.5px; color:var(--muted);}
  .qty-controls{display:flex; align-items:center; gap:14px;}
  .qty-btn{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--surface);
    color:var(--paper); font-size:16px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .qty-btn:hover{border-color:var(--gold);}
  .qty-btn:disabled{opacity:.35; cursor:not-allowed;}
  .qty-value{font-family:'JetBrains Mono', monospace; font-weight:700; font-size:18px; min-width:48px; text-align:center;}

  .price-lines{border-top:1px dashed var(--border); border-bottom:1px dashed var(--border); padding:16px 0; margin-bottom:20px; display:flex; flex-direction:column; gap:8px;}
  .price-line{display:flex; justify-content:space-between; font-size:13.5px; color:var(--muted);}
  .price-line.final{color:var(--paper); font-weight:700; font-size:16px; padding-top:6px; border-top:1px solid var(--border); margin-top:2px;}
  .price-line .val{font-family:'JetBrains Mono', monospace;}

  .btn{
    width:100%; padding:14px; border-radius:10px; border:none; cursor:pointer;
    font-weight:700; font-size:14px; font-family:'Inter', sans-serif; transition:.15s;
  }
  .btn-primary{background:var(--gold); color:#14171F;}
  .btn-primary:hover{background:#f0b850;}
  .btn-ghost{background:transparent; border:1px solid var(--border); color:var(--paper); margin-top:10px;}
  .btn-ghost:hover{border-color:var(--gold-dim);}

  .confirm-icon{width:56px; height:56px; border-radius:50%; background:rgba(79,176,165,.15); border:1.5px solid var(--teal); display:flex; align-items:center; justify-content:center; margin:0 auto 16px auto; color:var(--teal); font-size:24px;}
  .confirm-text{text-align:center; color:var(--muted); font-size:13.5px; margin-bottom:22px; line-height:1.5;}

  /* ===== TABLES (Billing/Downloads) ===== */
  .table{width:100%; border-collapse:collapse;}
  .table th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted);
    padding:0 14px 12px 14px; font-weight:600;
  }
  .table td{
    padding:14px; background:var(--surface); border-top:1px solid var(--border); font-size:13.5px;
  }
  .table tr td:first-child{border-radius:10px 0 0 10px;}
  .table tr td:last-child{border-radius:0 10px 10px 0;}
  .table .amt{font-family:'JetBrains Mono', monospace; color:var(--gold); font-weight:600;}
  .table .link-btn{color:var(--teal); font-weight:600; cursor:pointer; font-size:12.5px;}
  .empty-state{
    text-align:center; padding:60px 20px; color:var(--muted); background:var(--surface);
    border:1px dashed var(--border); border-radius:12px;
  }
  .empty-state .display{font-size:17px; color:var(--paper); margin-bottom:6px; display:block;}

  .toggle{
    width:38px; height:22px; border-radius:20px; background:var(--surface-raised); border:1px solid var(--border);
    position:relative; cursor:pointer; flex-shrink:0;
  }
  .toggle.on{background:var(--teal); border-color:var(--teal);}
  .toggle-dot{
    width:16px; height:16px; border-radius:50%; background:var(--muted); position:absolute; top:2px; left:2px;
    transition:.15s;
  }
  .toggle.on .toggle-dot{background:#fff; left:18px;}

  .list-row{
    display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:14px 16px; margin-bottom:10px;
  }
  .list-row-title{font-weight:600; font-size:14px;}
  .list-row-sub{color:var(--muted); font-size:12px; margin-top:2px;}

  /* Affiliate */
  .affiliate-hero{
    background:linear-gradient(135deg, var(--surface) 0%, var(--surface-raised) 100%);
    border:1px solid var(--border); border-radius:14px; padding:28px; margin-bottom:24px;
  }
  .ref-box{
    display:flex; align-items:center; gap:10px; background:var(--ink); border:1px dashed var(--gold-dim);
    border-radius:10px; padding:12px 16px; margin-top:16px; max-width:420px;
  }
  .ref-code{font-family:'JetBrains Mono', monospace; color:var(--gold); font-weight:700; letter-spacing:.05em; flex:1;}
  .copy-btn{background:transparent; border:1px solid var(--border); color:var(--paper); padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px;}
  .copy-btn:hover{border-color:var(--gold);}

  .toast{
    position:fixed; bottom:24px; right:24px; background:var(--surface-raised); border:1px solid var(--teal);
    color:var(--paper); padding:14px 20px; border-radius:10px; font-size:13.5px; z-index:100;
    display:flex; align-items:center; gap:10px; transform:translateY(120%); transition:transform .3s ease;
  }
  .toast.show{transform:translateY(0);}

  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  @media (max-width:900px){
    .sidebar{position:fixed; left:-260px; z-index:60; transition:.2s; box-shadow:0 0 40px rgba(0,0,0,.5);}
    .sidebar.open{left:0;}
    .main{padding:20px;}
    .stat-grid, .quick-grid, .card-grid{grid-template-columns:1fr;}
    .menu-btn{display:flex !important;}
  }
  .menu-btn{display:none; width:38px; height:38px; border-radius:8px; background:var(--surface); border:1px solid var(--border); color:var(--paper); align-items:center; justify-content:center; cursor:pointer; margin-right:12px;}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <div class="brand-stamp">AH</div>
        <div>
          <div class="brand-name">AdHabits</div>
          <div class="brand-sub">Leads Marketplace</div>
        </div>
      </div>
    </div>
    <ul class="nav" id="navList"></ul>
  </aside>

  <main class="main">
    <div class="topbar">
      <div style="display:flex; align-items:center;">
        <div class="menu-btn" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</div>
        <div>
          <div class="greeting display" id="pageTitle">Dashboard</div>
          <div class="greeting-sub" id="pageSub">Welcome back, here's your account at a glance.</div>
        </div>
      </div>
      <div class="wallet">
        <div>
          <div class="wallet-label">Leads Bought</div>
          <div class="wallet-value mono" id="walletTotal">0</div>
        </div>
      </div>
    </div>

    <div id="content"></div>
  </main>
</div>

<div class="overlay hidden" id="overlay">
  <div class="panel" id="panelBody"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ DATA ============ */
const REGIONS = ["North India","South India","East India","West India"];

function makePackages(platform, basePrice){
  const items = [
    {key:"housewife", name:"Housewife Leads", desc:"Homemakers exploring flexible income opportunities.", price: basePrice+2},
    {key:"student", name:"Student Leads", desc:"College-age audience open to part-time earning models.", price: basePrice-1},
    {key:"female", name:"Only Female Leads", desc:"Verified female contacts across active age groups.", price: basePrice+3},
    {key:"male", name:"Only Male Leads", desc:"Verified male contacts across active age groups.", price: basePrice+3},
    {key:"mixed", name:"Mixed Leads", desc:"Balanced mix, no gender or occupation filter applied.", price: basePrice},
    {key:"region", name:"Region-wise Leads", desc:"Pick a zone — North, South, East or West India.", price: basePrice+4, isRegion:true},
  ];
  return items.map(it => ({
    id: platform.toLowerCase()+"-"+it.key,
    platform, name: it.name, desc: it.desc, price: it.price,
    isRegion: !!it.isRegion,
    fav:false, notify:false
  }));
}

const state = {
  view: "dashboard",
  activePlatform: "Instagram",
  packages: {
    Instagram: makePackages("Instagram", 16),
    Facebook: makePackages("Facebook", 13),
  },
  orders: [],      // {id, date, package, platform, qty, amount, region}
  downloads: [],   // {id, package, platform, qty, date}
  orderCounter: 1000,
  checkout: null,  // {pkg, region, qty}
};

const NAV = [
  {id:"dashboard", label:"Dashboard", icon:iconGrid()},
  {id:"leadsbuy", label:"Leads Buy", icon:iconCart()},
  {id:"downloads", label:"Downloads", icon:iconDownload()},
  {id:"affiliate", label:"Affiliate Program", icon:iconUsers()},
  {id:"favourites", label:"Favourite Packages", icon:iconHeart()},
  {id:"notifications", label:"Notifications", icon:iconBell()},
  {id:"billing", label:"Billing", icon:iconReceipt()},
];

/* ============ ICONS (inline svg strings) ============ */
function iconGrid(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`;}
function iconCart(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h2l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.6L21 7H6"/></svg>`;}
function iconDownload(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 18v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>`;}
function iconUsers(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c.6-3.6 3.3-6 6.5-6s5.9 2.4 6.5 6"/><circle cx="18" cy="8.5" r="2.4"/><path d="M16 14.2c2.4.5 4.2 2.6 4.7 5.8"/></svg>`;}
function iconHeart(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 20.5s-7.5-4.7-9.8-9.2C.6 7.8 2.3 4.5 5.6 4c2.1-.3 4 .8 6.4 3 2.4-2.2 4.3-3.3 6.4-3 3.3.5 5 3.8 3.4 7.3-2.3 4.5-9.8 9.2-9.8 9.2z"/></svg>`;}
function iconBell(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`;}
function iconReceipt(){return `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2V2z"/><path d="M9 8h6M9 12h6"/></svg>`;}

/* ============ RENDER: SIDEBAR ============ */
function renderNav(){
  const notifyCount = Object.values(state.packages).flat().filter(p=>p.notify).length;
  const favCount = Object.values(state.packages).flat().filter(p=>p.fav).length;
  const ul = document.getElementById('navList');
  ul.innerHTML = NAV.map(item=>{
    let badge = "";
    if(item.id==="favourites" && favCount>0) badge = `<span class="nav-badge">${favCount}</span>`;
    if(item.id==="notifications" && notifyCount>0) badge = `<span class="nav-badge">${notifyCount}</span>`;
    if(item.id==="billing" && state.orders.length>0) badge = `<span class="nav-badge">${state.orders.length}</span>`;
    return `<li class="nav-item ${state.view===item.id?'active':''}" onclick="setView('${item.id}')">
      <span class="nav-icon">${item.icon}</span>${item.label}${badge}
    </li>`;
  }).join("");
}

function setView(v){
  state.view = v;
  document.getElementById('sidebar').classList.remove('open');
  render();
}

/* ============ RENDER: MAIN ============ */
const TITLES = {
  dashboard:["Dashboard","Welcome back, here's your account at a glance."],
  leadsbuy:["Leads Buy","Browse platforms, pick a package, set your quantity."],
  downloads:["Downloads","Files from your completed lead purchases."],
  affiliate:["Affiliate Program","Share your link, earn commission on new buyers."],
  favourites:["Favourite Packages","Your saved packages, one tap away."],
  notifications:["Notifications","Get alerted when a package gets fresh leads."],
  billing:["Billing","Every order, invoiced and on record."],
};

function render(){
  renderNav();
  const [title, sub] = TITLES[state.view];
  document.getElementById('pageTitle').textContent = title;
  document.getElementById('pageSub').textContent = sub;
  const totalLeads = state.orders.reduce((s,o)=>s+o.qty,0);
  document.getElementById('walletTotal').textContent = totalLeads.toLocaleString();

  const c = document.getElementById('content');
  if(state.view==="dashboard") c.innerHTML = renderDashboard();
  else if(state.view==="leadsbuy") c.innerHTML = renderLeadsBuy();
  else if(state.view==="downloads") c.innerHTML = renderDownloads();
  else if(state.view==="affiliate") c.innerHTML = renderAffiliate();
  else if(state.view==="favourites") c.innerHTML = renderFavourites();
  else if(state.view==="notifications") c.innerHTML = renderNotifications();
  else if(state.view==="billing") c.innerHTML = renderBilling();
}

function renderDashboard(){
  const totalSpent = state.orders.reduce((s,o)=>s+o.amount,0);
  const favCount = Object.values(state.packages).flat().filter(p=>p.fav).length;
  const notifyCount = Object.values(state.packages).flat().filter(p=>p.notify).length;
  return `
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${state.orders.length}</div><div class="stat-label">Total Orders</div></div>
      <div class="stat-card"><div class="stat-num">₹${totalSpent.toLocaleString('en-IN',{maximumFractionDigits:0})}</div><div class="stat-label">Total Spent</div></div>
      <div class="stat-card"><div class="stat-num">${favCount}</div><div class="stat-label">Favourite Packages</div></div>
      <div class="stat-card"><div class="stat-num">${notifyCount}</div><div class="stat-label">Active Alerts</div></div>
    </div>
    <div class="section-title">Quick Access <span class="tag">jump in</span></div>
    <div class="quick-grid">
      <div class="quick-card" onclick="setView('leadsbuy')">
        <div><div class="quick-card-title">Buy Leads</div><div class="quick-card-sub">Instagram & Facebook packages, priced per lead</div></div>
        <div class="arrow">→</div>
      </div>
      <div class="quick-card" onclick="setView('favourites')">
        <div><div class="quick-card-title">Favourite Packages</div><div class="quick-card-sub">Reorder your go-to package in one click</div></div>
        <div class="arrow">→</div>
      </div>
      <div class="quick-card" onclick="setView('downloads')">
        <div><div class="quick-card-title">Downloads</div><div class="quick-card-sub">Get files from past purchases</div></div>
        <div class="arrow">→</div>
      </div>
      <div class="quick-card" onclick="setView('affiliate')">
        <div><div class="quick-card-title">Affiliate Program</div><div class="quick-card-sub">Share your link and earn commission</div></div>
        <div class="arrow">→</div>
      </div>
    </div>
    <div class="section-title">Recent Orders</div>
    ${state.orders.length ? renderBillingTable(state.orders.slice(-3).reverse()) : emptyState("No orders yet","Head to Leads Buy to make your first purchase.")}
  `;
}

function renderLeadsBuy(){
  const platforms = Object.keys(state.packages);
  const pkgs = state.packages[state.activePlatform];
  return `
    <div class="platform-tabs">
      ${platforms.map(p=>`
        <div class="platform-tab ${state.activePlatform===p?'active':''}" onclick="switchPlatform('${p}')">
          <span class="platform-dot" style="background:${p==='Instagram'?'#E1306C':'#1877F2'}"></span>${p} Leads
        </div>`).join("")}
    </div>
    <div class="card-grid">
      ${pkgs.map(pkg=>renderLeadCard(pkg)).join("")}
    </div>
  `;
}

function renderLeadCard(pkg){
  return `
    <div class="lead-card" onclick="openPackage('${pkg.id}')">
      <div class="lead-card-top">
        <div>
          <div class="lead-card-title">${pkg.name}</div>
          <div class="lead-card-plat">${pkg.platform}</div>
        </div>
        <div class="stamp"><div class="stamp-price">₹${pkg.price}</div><div class="stamp-unit">/lead</div></div>
      </div>
      ${pkg.isRegion ? `<div class="region-chips">${REGIONS.map(r=>`<span class="region-chip">${r}</span>`).join("")}</div>` : `<div class="lead-card-desc">${pkg.desc}</div>`}
      <div class="lead-card-foot">
        <div style="display:flex; gap:8px;">
          <button class="icon-btn ${pkg.fav?'on':''}" onclick="event.stopPropagation(); toggleFav('${pkg.id}')" title="Favourite">${pkg.fav?'♥':'♡'}</button>
          <button class="icon-btn bell ${pkg.notify?'on':''}" onclick="event.stopPropagation(); toggleNotify('${pkg.id}')" title="Notify on new leads">🔔</button>
        </div>
        <div class="select-link">Select <span>→</span></div>
      </div>
    </div>
  `;
}

function renderDownloads(){
  if(!state.downloads.length) return emptyState("No downloads yet","Files appear here right after checkout.");
  return `
    <table class="table">
      <thead><tr><th>Package</th><th>Platform</th><th>Leads</th><th>Purchased</th><th></th></tr></thead>
      <tbody>
        ${state.downloads.map(d=>`
          <tr>
            <td style="font-weight:600;">${d.package}</td>
            <td>${d.platform}</td>
            <td class="mono">${d.qty}</td>
            <td>${d.date}</td>
            <td><span class="link-btn" onclick="downloadFile('${d.id}')">⬇ Download CSV</span></td>
          </tr>`).join("")}
      </tbody>
    </table>
  `;
}

function renderBillingTable(orders){
  return `
    <table class="table">
      <thead><tr><th>Order ID</th><th>Package</th><th>Qty</th><th>Amount</th><th>Date</th><th></th></tr></thead>
      <tbody>
        ${orders.map(o=>`
          <tr>
            <td class="mono">#${o.id}</td>
            <td style="font-weight:600;">${o.package}</td>
            <td class="mono">${o.qty}</td>
            <td class="amt">₹${o.amount.toLocaleString('en-IN',{maximumFractionDigits:2})}</td>
            <td>${o.date}</td>
            <td><span class="link-btn" onclick="viewInvoice('${o.id}')">Invoice</span></td>
          </tr>`).join("")}
      </tbody>
    </table>
  `;
}

function renderBilling(){
  if(!state.orders.length) return emptyState("No billing history","Your invoices will show up here after checkout.");
  return renderBillingTable([...state.orders].reverse());
}

function renderAffiliate(){
  return `
    <div class="affiliate-hero">
      <div class="section-title" style="margin-bottom:8px;">Earn by referring buyers</div>
      <div style="color:var(--muted); font-size:13.5px; max-width:480px; line-height:1.6;">
        Share your referral link with other affiliate or network marketers. When they sign up and buy leads, you earn a commission on their order. Commission rate and payout cycle will be confirmed before launch.
      </div>
      <div class="ref-box">
        <span class="ref-code" id="refCode">ADHABITS-HIFZ-7821</span>
        <button class="copy-btn" onclick="copyRef()">Copy Link</button>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-card"><div class="stat-num">0</div><div class="stat-label">Referred Buyers</div></div>
      <div class="stat-card"><div class="stat-num">₹0</div><div class="stat-label">Commission Earned</div></div>
      <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">Commission Rate</div></div>
      <div class="stat-card"><div class="stat-num">—</div><div class="stat-label">Payout Cycle</div></div>
    </div>
  `;
}

function renderFavourites(){
  const favs = Object.values(state.packages).flat().filter(p=>p.fav);
  if(!favs.length) return emptyState("No favourites yet","Tap the heart icon on any package in Leads Buy to save it here.");
  return `<div class="card-grid">${favs.map(pkg=>renderLeadCard(pkg)).join("")}</div>`;
}

function renderNotifications(){
  const notified = Object.values(state.packages).flat().filter(p=>p.notify);
  return `
    <div class="section-title">Alerts On <span class="tag">${notified.length} active</span></div>
    ${notified.length ? notified.map(p=>`
      <div class="list-row">
        <div>
          <div class="list-row-title">${p.name}</div>
          <div class="list-row-sub">${p.platform} · you'll be alerted when new leads are added</div>
        </div>
        <div class="toggle on" onclick="toggleNotify('${p.id}')"><div class="toggle-dot"></div></div>
      </div>`).join("") : emptyState("No alerts set","Toggle the bell icon on any package to get notified about new leads.")}
  `;
}

function emptyState(title, sub){
  return `<div class="empty-state"><span class="display">${title}</span>${sub}</div>`;
}

/* ============ ACTIONS ============ */
function switchPlatform(p){ state.activePlatform = p; render(); }

function findPkg(id){
  for(const plat of Object.keys(state.packages)){
    const found = state.packages[plat].find(p=>p.id===id);
    if(found) return found;
  }
}

function toggleFav(id){ const p = findPkg(id); p.fav = !p.fav; showToast(p.fav ? `Added "${p.name}" to favourites` : `Removed from favourites`); render(); }
function toggleNotify(id){ const p = findPkg(id); p.notify = !p.notify; showToast(p.notify ? `Alerts turned on for "${p.name}"` : `Alerts turned off`); render(); }

function openPackage(id){
  const pkg = findPkg(id);
  state.checkout = { pkg, qty: 50, region: pkg.isRegion ? REGIONS[0] : null };
  renderPanel();
}

function closePanel(){ document.getElementById('overlay').classList.add('hidden'); state.checkout = null; }

function changeQty(delta){
  const co = state.checkout;
  const next = co.qty + delta;
  if(next < 50) return;
  co.qty = next;
  renderPanel();
}

function setRegion(r){ state.checkout.region = r; renderPanel(); }

function renderPanel(){
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  const co = state.checkout;
  const pkg = co.pkg;
  const subtotal = pkg.price * co.qty;
  const gst = subtotal * 0.18;
  const final = subtotal + gst;

  document.getElementById('panelBody').innerHTML = `
    <div class="panel-head">
      <div>
        <div class="panel-title">${pkg.name}${co.region ? " — " + co.region : ""}</div>
      </div>
      <div class="close-x" onclick="closePanel()">✕</div>
    </div>
    <div class="panel-plat">${pkg.platform} · ₹${pkg.price} per lead</div>

    ${pkg.isRegion ? `
      <div style="margin-bottom:18px;">
        <div class="qty-label" style="margin-bottom:8px;">Choose region</div>
        <div class="region-chips">
          ${REGIONS.map(r=>`<span class="region-chip" style="cursor:pointer; ${co.region===r ? 'background:var(--gold); color:#14171F; border-color:var(--gold); font-weight:700;' : 'color:var(--muted); border-color:var(--border);'}" onclick="setRegion('${r}')">${r}</span>`).join("")}
        </div>
      </div>` : ""}

    <div class="qty-row">
      <div class="qty-label">Quantity<br><span style="font-size:11px;">min. 50 · steps of 10</span></div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty(-10)" ${co.qty<=50?'disabled':''}>−</button>
        <div class="qty-value">${co.qty}</div>
        <button class="qty-btn" onclick="changeQty(10)">+</button>
      </div>
    </div>

    <div class="price-lines">
      <div class="price-line"><span>Price per lead</span><span class="val">₹${pkg.price.toFixed(2)}</span></div>
      <div class="price-line"><span>Subtotal (${co.qty} leads)</span><span class="val">₹${subtotal.toFixed(2)}</span></div>
      <div class="price-line"><span>GST (18%)</span><span class="val">₹${gst.toFixed(2)}</span></div>
      <div class="price-line final"><span>Final Amount</span><span class="val">₹${final.toFixed(2)}</span></div>
    </div>

    <button class="btn btn-primary" onclick="confirmOrder()">Buy Now — ₹${final.toFixed(2)}</button>
    <button class="btn btn-ghost" onclick="closePanel()">Cancel</button>
  `;
}

function confirmOrder(){
  const co = state.checkout;
  const pkg = co.pkg;
  const subtotal = pkg.price * co.qty;
  const final = subtotal * 1.18;
  const id = state.orderCounter++;
  const date = new Date().toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'});
  const label = pkg.name + (co.region ? " (" + co.region + ")" : "");

  state.orders.push({ id, date, package:label, platform:pkg.platform, qty:co.qty, amount:final });
  state.downloads.push({ id: 'dl-'+id, package:label, platform:pkg.platform, qty:co.qty, date });

  document.getElementById('panelBody').innerHTML = `
    <div class="confirm-icon">✓</div>
    <div class="panel-title" style="text-align:center; margin-bottom:6px;">Order Confirmed</div>
    <div class="confirm-text">
      Order #${id} for ${co.qty} leads from <strong style="color:var(--paper);">${label}</strong> is complete.
      Your file is ready in Downloads and the invoice is saved to Billing.
    </div>
    <button class="btn btn-primary" onclick="closePanel(); setView('downloads');">Go to Downloads</button>
    <button class="btn btn-ghost" onclick="closePanel()">Close</button>
  `;
  showToast(`Order #${id} confirmed — ₹${final.toFixed(2)}`);
}

function downloadFile(id){
  const d = state.downloads.find(x=>x.id===id);
  const rows = ["name,phone,city,source"];
  for(let i=1;i<=Math.min(d.qty,25);i++){
    rows.push(`Lead ${i},9800${String(100000+i).slice(-6)},—,${d.platform}`);
  }
  const csv = rows.join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${d.package.replace(/\s+/g,'_')}_${d.qty}leads.csv`;
  a.click();
  showToast("Download started");
}

function viewInvoice(id){
  const o = state.orders.find(x=>x.id==id);
  const txt = `AdHabits Leads Marketplace — Invoice #${o.id}\nDate: ${o.date}\nPackage: ${o.package}\nPlatform: ${o.platform}\nQuantity: ${o.qty} leads\nSubtotal: ₹${(o.amount/1.18).toFixed(2)}\nGST (18%): ₹${(o.amount - o.amount/1.18).toFixed(2)}\nTotal: ₹${o.amount.toFixed(2)}`;
  const blob = new Blob([txt], {type:"text/plain"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `invoice_${o.id}.txt`;
  a.click();
}

function copyRef(){
  const code = document.getElementById('refCode').textContent;
  navigator.clipboard?.writeText(code).catch(()=>{});
  showToast("Referral link copied");
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 2600);
}

render();
</script>
</body>
</html>
